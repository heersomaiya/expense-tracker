<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Edit Expense</h1>

    <form method="POST">

        <label>Amount:</label>
        <input type="number" name="amount" value="{{ expense.amount }}" required>
        <br><br>

        <label>Category:</label>
        <input type="text" name="category" value="{{ expense.category }}" required>
        <br><br>

        <label>Description:</label>
        <input type="text" name="description" value="{{ expense.description }}" required>
        <br><br>

        <label>Date:</label>
        <input type="date" name="date" value="{{ expense.date }}" required>
        <br><br>

        <button type="submit">Update Expense</button>
    </form>

    <br>
    <a href="/">
        <button type="button">Back</button>
    </a>

</body>

</html>
